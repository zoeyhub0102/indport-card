<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>好口國際｜傳送電子名片</title>
<style>
  body{margin:0;font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;background:#024D87;color:#fff;
       min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
  img{width:240px;border-radius:12px;margin-bottom:20px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  button{background:#fff;color:#024D87;border:0;border-radius:999px;font-size:17px;font-weight:700;padding:14px 36px;margin-top:16px}
  #msg{font-size:14px;color:#BFD3EB;margin-top:14px;min-height:20px}
</style>
</head>
<body>
  <img src="card-front.jpg" alt="名片">
  <div>選擇要傳送名片的好友或群組</div>
  <button id="share">選擇好友，傳送名片</button>
  <div id="msg">載入中…</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="card.js"></script>
<script>
// LIFF ID 已移到 card.js 最上面
const msg = (t) => (document.getElementById("msg").textContent = t);
let message = null;

async function share() {
  if (!message) message = buildMessage(readParams(), location.href);
  if (!liff.isApiAvailable("shareTargetPicker")) {
    msg("請在手機的 LINE App 裡開啟這個連結");
    return;
  }
  try {
    const res = await liff.shareTargetPicker([message], { isMultiple: true });
    if (res) {
      msg("已送出！");
      if (liff.isInClient()) setTimeout(() => liff.closeWindow(), 800);
    } else {
      msg("已取消");
    }
  } catch (e) {
    msg("傳送失敗：" + (e.code || "") + " " + (e.message || e));
  }
}

document.getElementById("share").onclick = share;

liff.init({ liffId: LIFF_ID }).then(() => {
  if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
  message = buildMessage(readParams(), location.href);
  msg("");
  share();
}).catch((e) => msg("初始化失敗：" + e.message));
</script>
</body>
</html>
